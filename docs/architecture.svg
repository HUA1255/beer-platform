<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img">
<title>Beer Platform 架构（第 30 版方案，第一版从简，2026-11-09）</title>
<desc>第一版从简。MacBook 上有 DSH Desktop（AI 对话和工作台 Beer；Beer 直接读写 Obsidian 库、生成选题简报和平台版本，并负责发布到 Rin 博客和内容平台）和 Obsidian（写作和内容库）。内容库只放在 MacBook 上，不同步，备份用时间机器。Beer 经 Tailscale 调用 Mac mini 的 HTTP API：上传录音、提交视频链接、提交转录、取回结果写进素材文件夹，并把这些操作注册成 AI 工具。Beer 直接经互联网调用 Cloudflare 上的提醒服务（Worker + D1 + 每分钟定时检查，HTTP API），到点用 Cloudflare 自带发信给自己发邮件，不经过家里。Mac mini 运行一个 launchd 托管的 Python 服务，负责上传和转录调度，通过 opencode go 生成摘要、通过邮箱发通知，经千兆局域网调用常开的 Windows 转录服务（B 站、YouTube 视频链接也由它先取字幕、没有再下载音轨转写），录音原件经局域网存到 NAS 上可配置的路径。NAS 只存文件，不接入 Tailscale，外出看 NAS 上的文件用极空间 App。</desc>
<style>
  text { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; dominant-baseline: central; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .mid { text-anchor: middle; }
  .host rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .host text { fill: #3C3489; }
  .done rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .done .th { fill: #085041; }
  .done .ts { fill: #0F6E56; }
  .ext rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .ext .th { fill: #444441; }
  .ext .ts { fill: #5F5E5A; }
  .label { fill: #5F5E5A; }
  .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
  .tbd { stroke-dasharray: 4 3; }
</style>
