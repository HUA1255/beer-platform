<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台布局草图 v3</title>
<style>
:root{
  --bg:#f3efe8; --paper:#fbf8f3; --line:#e6dfd4; --line2:#efe9df;
  --ink:#2b2621; --ink2:#6f665c; --ink3:#a39a8f;
  --accent:#d9694a; --accent-soft:#fbe7df; --accent-ink:#b4482b;
  --ok:#3f8f5a; --ok-soft:#e3f2e7; --warn:#c08a1e; --warn-soft:#faf0d6; --bad:#c0463b; --bad-soft:#f8e1de;
  --blue:#3d6fb6; --blue-soft:#e3ecf8; --violet:#7a5bb5; --violet-soft:#ece6f7;
  --host:#efebe4; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 14px}
.decided{background:var(--ok-soft);border:1px solid #c9e3d1;border-radius:12px;padding:10px 16px;margin-bottom:14px;font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:9;align-items:center}
nav button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink2)}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lead{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin-bottom:14px}
.lead b{color:var(--accent-ink)}
.stage{width:100%;overflow:hidden;border-radius:14px;box-shadow:0 10px 30px rgba(60,40,20,.12);background:#000}
.frame{width:1280px;height:760px;transform-origin:0 0;background:var(--paper);display:flex;position:relative;font-size:13px;overflow:hidden}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
@media (max-width:900px){.notes{grid-template-columns:1fr}}
.note{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.note h3{margin:0 0 6px;font-size:14px}
.note ul{margin:0;padding-left:18px} .note li{margin:3px 0}
.note.a h3{color:var(--ok)} .note.b h3{color:var(--accent-ink)} .note.c h3{color:var(--blue)}

.hside{width:52px;background:var(--host);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:8px;align-items:center;flex:none}
.hside .sq{width:28px;height:28px;border-radius:8px;background:#ddd5c9}
.biz{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.topbar{display:flex;gap:7px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.topbar .ttl{font-weight:700;font-size:15px;margin-right:4px;white-space:nowrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:1px 9px;color:var(--ink2);white-space:nowrap;font-size:12px}
.pill.money{background:var(--accent-soft);color:var(--accent-ink);border-color:#f1cdbf}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 4px 0 2px;vertical-align:1px}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)}
.search{border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px 10px;color:var(--ink3);white-space:nowrap;overflow:hidden}
.tabs{display:flex;gap:1px;padding:6px 12px 0;border-bottom:1px solid var(--line);align-items:flex-end}
.tabs div{padding:6px 11px;border-radius:8px 8px 0 0;color:var(--ink2);white-space:nowrap}
.tabs div.on{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px;color:var(--ink);font-weight:600}
.tabs .home{font-weight:600}
.n{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;text-align:center;margin-left:4px;line-height:16px;font-weight:600}
.content{flex:1;overflow:hidden;position:relative}
.chip{display:inline-block;font-size:11px;padding:0 7px;border-radius:5px;line-height:18px;white-space:nowrap}
.c-meet{background:var(--blue-soft);color:var(--blue)} .c-idea{background:var(--warn-soft);color:#94680f} .c-class{background:var(--violet-soft);color:var(--violet)}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-run{background:var(--accent-soft);color:var(--accent-ink)} .c-q{background:#eee;color:#777} .c-bad{background:var(--bad-soft);color:var(--bad)}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 9px;font-size:12px;color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.drop{border:1.5px dashed #d8c9b8;border-radius:10px;padding:8px;text-align:center;color:var(--ink2);background:#fffdf9}
.row{display:flex;align-items:center;gap:7px}
.bar{height:4px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--ink3)} .small{font-size:12px} .xs{font-size:11px}
.sec{font-size:11px;color:var(--ink3);letter-spacing:.04em;margin:10px 0 5px}
.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 11px;margin:6px 0}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.t{color:var(--ink);font-weight:600}
.kbd{font-family:var(--mono);font-size:11px;background:#f2ede6;padding:0 4px;border-radius:3px;color:var(--ink2)}
.tree{font-size:13px;line-height:2}
.tree .f{color:var(--ink2)} .tree .on{background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--ink);font-weight:600}
.tree .c{float:right;color:var(--ink3);font-size:11px}
.pane{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prev p{margin:6px 0;color:#3b352f;line-height:1.75} .prev ul{margin:4px 0;padding-left:20px;line-height:1.8}
.md{font-family:var(--mono);font-size:12.5px;line-height:1.85;color:#3b352f}
.md .ln{display:inline-block;width:24px;color:#c4bbb0;text-align:right;margin-right:10px} .md .fm{color:var(--violet)}
del{background:var(--bad-soft);color:var(--bad);text-decoration:none} ins{background:var(--ok-soft);color:var(--ok);text-decoration:none}
.wave{height:32px;border-radius:8px;background:repeating-linear-gradient(90deg,#e3d6c6 0 2px,transparent 2px 5px)}
.toggle{display:inline-block;width:38px;height:22px;border-radius:11px;background:#d9d2c8;position:relative;vertical-align:middle}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.tile .big{font-size:24px;font-weight:700;line-height:1.2}
.overlay{position:absolute;inset:0;background:rgba(40,30,20,.28);display:flex;align-items:center;justify-content:center;z-index:5}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.2);padding:16px 18px;width:520px}

.chat{width:360px;flex:none;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column}
.chat .hd{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.chat .bd{flex:1;padding:8px 12px;overflow:hidden;font-size:12.5px}
.chat .ft{margin:8px 10px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:7px 10px;color:var(--ink3);min-height:74px}
.chat .ctx{display:inline-block;background:#f2ede6;border-radius:6px;padding:0 6px;font-size:11px;color:var(--ink2);margin-bottom:4px}
.msg{margin:7px 0;color:var(--ink2)} .msg.u{background:#eef2fb;border-radius:10px;padding:6px 10px;margin-left:30px;color:var(--ink)}
.chatmini{width:44px;flex:none;border-left:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:10px}
.chatmini .v{writing-mode:vertical-rl;color:var(--ink2);font-size:12px;letter-spacing:.2em}
.mk{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff;z-index:7}
/* 截图模式：地址后加 #shot=分页名，只显示设计稿本身 */
body.shot{margin:0;background:#fff}
body.shot .wrap{padding:0;max-width:none}
body.shot .wrap>h1,body.shot .wrap>.sub,body.shot .wrap>.decided,body.shot nav,body.shot .lead,body.shot .notes,body.shot .mk{display:none!important}
body.shot .stage{width:1280px;border-radius:0;box-shadow:none}
</style>
</head>
<body>
<div class="wrap">
<h1>工作台布局草图 · 第三版</h1>
<p class="sub">按你选的组合重画：<b>分页在顶部 · 有首页 · AI 对话常驻右侧可收起 · 发布审核是其中一页</b>。<a href="v2.html" style="color:var(--ink3)">← 第二版</a> · <a href="v1.html" style="color:var(--ink3)">第一版</a></p>
<div class="decided">每页都是同一个外框：左边是收起后的宿主侧栏（52px），中间是业务区（约 870px），右边是 AI 对话栏（360px，可收起成 44px 的窄条）。外框下面是同一套东西在各个分页的样子。</div>
<nav id="nav"></nav>
<div id="secs"></div>
</div>

<script>
const TABS=[['首页'],['录音',1],['素材'],['选题'],['文章'],['发布',2],['规则'],['回收站'],'|',['工作 SOP'],['读书笔记']];
function tabs(on){return `<div class="tabs">${TABS.map(x=>x==='|'?`<span style="width:1px;height:18px;background:var(--line);margin:0 6px 7px"></span>`:(([n,c])=>`<div class="${n===on?'on':''} ${n==='首页'?'home':''}">${n==='首页'?'⌂ ':''}${n}${c?`<span class="n">${c}</span>`:''}</div>`)(x)).join('')}<div class="muted">＋</div></div>`}
function topbar(){return `<div class="topbar"><span class="ttl">内容工作台</span><span class="search" style="width:230px">搜索整个 Obsidian 库 ⌘K</span>
<span class="pill"><span class="dot d-ok"></span>Mac mini<span class="dot d-warn" style="margin-left:8px"></span>Windows 休眠<span class="dot d-ok" style="margin-left:8px"></span>NAS</span>
<span class="pill money" title="opencode go 套餐">Go 限额 5h 32% · 周 18% · 月 9%</span><span class="btn ghost" style="margin-left:auto">A− A+</span></div>`}
function chatOpen(title,body,ctx){return `<div class="chat"><div class="hd"><b>AI</b><span class="pill" style="max-width:190px;overflow:hidden;text-overflow:ellipsis">${title} ▾</span><span class="btn ghost" title="新对话">＋</span><span class="btn ghost" style="margin-left:auto">⇥ 收起</span></div>
<div class="bd">${body}</div><div class="ft">${ctx?`<span class="ctx">📎 ${ctx} ×</span><br>`:''}发消息… <span class="xs">/ 指令 · @ 文件</span></div></div>`}
function chatMini(){return `<div class="chatmini"><span class="btn ghost">⇤</span><span class="v">AI 对话</span><span class="n" style="margin:0">1</span></div>`}
function frame(tab,content,chat,marks=''){return `<div class="stage"><div class="frame"><div class="hside"><div class="sq" style="background:var(--ink)"></div><div class="sq" style="background:var(--accent)"></div><div class="sq"></div><span class="xs muted" style="margin-top:auto">宿主</span></div>
<div class="biz">${topbar()}${tabs(tab)}<div class="content">${content}</div></div>${chat}${marks}</div></div>`}
const mk=(x,y,n,c='')=>`<div class="mk" style="left:${x}px;top:${y}px;${c}">${n}</div>`;
function notes(a,b,c){const L=x=>`<ul>${x.map(i=>`<li>${i}</li>`).join('')}</ul>`;return `<div class="notes"><div class="note a"><h3>${a[0]}</h3>${L(a[1])}</div><div class="note b"><h3>${b[0]}</h3>${L(b[1])}</div><div class="note c"><h3>${c[0]}</h3>${L(c[1])}</div></div>`}

/* ---------- page contents ---------- */
const homeTiles=(wide)=>`<div style="display:grid;grid-template-columns:${wide?'1.3fr 1fr 1fr':'1.15fr 1fr'};gap:10px;padding:12px 14px;align-content:start;height:100%">
<div class="tile" style="grid-row:span ${wide?2:3}">
  <div class="row"><b>等你处理</b><span class="n">4</span></div>
  <div class="card"><div class="row"><span class="chip c-run">待确认发布</span><span class="t">为什么我把笔记搬到 Obsidian</span></div><div class="xs muted">知乎、小红书、Rin 已生成 · <u>去审稿 →</u></div></div>
  <div class="card"><div class="row"><span class="chip c-run">待确认发布</span><span class="t">DeepSeek 一个月花了多少钱</span></div></div>
  <div class="card"><div class="row"><span class="chip c-q">新选题简报</span><span class="t">11-05 · 5 条</span></div></div>
  <div class="card"><div class="row"><span class="chip c-bad">冲突</span><span class="t">工作 SOP/报价书.md</span></div><div class="xs muted">工作台和 Obsidian 都改过 · <u>去处理 →</u></div></div>
  <div class="sec">今天的提醒</div><div class="small">14:00 回看上周知乎数据<br>周五「我的写作流水线」截稿</div>
</div>
<div class="tile"><div class="row"><b>录音</b><span class="xs muted" style="margin-left:auto">拖到这里上传</span></div>
  <div class="small" style="margin-top:6px">AI 产品课 第 3 讲 <span class="chip c-class">课程</span></div>
  <div class="xs muted">上传 ✓ 排队 ✓ <b style="color:var(--accent-ink)">转写 62%</b> 摘要 入库</div><div class="bar" style="margin-top:3px"><i style="width:62%"></i></div>
  <div class="small" style="margin-top:8px">周会：Q4 内容排期 <span class="chip c-ok">已入库</span></div></div>
<div class="tile"><b>本周产出</b><div class="row" style="margin-top:4px;gap:18px"><div><div class="big">3</div><div class="xs muted">新素材</div></div><div><div class="big">2</div><div class="xs muted">成稿</div></div><div><div class="big">1</div><div class="xs muted">已发布</div></div></div></div>
<div class="tile" ${wide?'style="grid-column:span 2"':''}><div class="row"><b>规则学习</b><span class="toggle"></span><span class="small muted">未开启</span></div>
  <div class="small" style="margin-top:4px">已积累改稿：知乎 <b>7</b> 篇 · 小红书 <b>4</b> 篇</div><div class="bar" style="margin-top:5px"><i style="width:55%;background:var(--ok)"></i></div></div>
</div>`;

const rec=`<div style="display:flex;gap:10px;padding:10px 12px;height:100%">
<div style="width:350px;flex:none">
  <div class="drop small">拖入录音（可多个）上传到家里<div class="xs muted">类型由 AI 判断 · 音频存 NAS，库里只存文字</div></div>
  <div class="sec">进行中</div>
  <div class="card"><div class="row"><span class="t">AI 产品课 第 3 讲</span><span class="chip c-class">课程</span><span class="muted xs" style="margin-left:auto">1:52:10</span></div><div class="xs muted" style="margin:2px 0">上传 ✓ · 排队 ✓ · <b style="color:var(--accent-ink)">转写 62%</b> · 摘要 · 入库</div><div class="bar"><i style="width:62%"></i></div></div>
  <div class="sec">已完成</div>
  <div class="card sel"><div class="row"><span class="t">周会：Q4 内容排期</span><span class="chip c-meet">会议</span><span class="muted xs" style="margin-left:auto">58:12</span></div>
    <div class="small" style="color:var(--ink2);margin:4px 0">结论：每周二出选题简报；知乎、小红书先半自动……<br>要点 5 条 · 可用素材 3 条</div>
    <div class="row"><span class="btn">在 Obsidian 打开</span><span class="btn">交给 AI 讨论</span><span class="btn ghost">类型不对？</span></div></div>
  <div class="card"><div class="row"><span class="t">通勤：笔记迁移</span><span class="chip c-idea">灵感</span><span class="chip c-q">音频在 NAS</span></div></div>
  <div class="card"><div class="row"><span class="t">2 小时讲座</span><span class="chip c-bad">上传失败：家里连不上</span><span class="btn" style="margin-left:auto">重试</span></div></div>
</div>
<div class="pane" style="flex:1;display:flex;flex-direction:column">
  <div style="padding:10px 14px;border-bottom:1px solid var(--line)">
    <div class="row"><b style="font-size:15px">周会：Q4 内容排期</b><span class="chip c-meet">会议</span><span class="btn" style="margin-left:auto">编辑</span></div>
    <div class="xs muted">素材/2026-11-04-周会/transcript.md</div>
    <div class="row" style="margin-top:8px"><span class="btn">⟲15</span><span class="btn pri">▶</span><span class="btn">15⟳</span><div class="wave" style="flex:1"></div><span class="xs muted">12:40/58:12</span><span class="btn">1×</span></div>
    <div class="row xs" style="margin-top:5px"><span class="chip c-ok">本地有音频</span><span class="muted">从本机上传，直接播放</span></div>
    <div class="row xs" style="margin-top:4px;padding:5px 7px;background:#fbf6ee;border-radius:8px"><span class="chip c-q">音频在 NAS</span><span class="muted">点 ▶ 后从家里下载 34%</span><div class="bar" style="flex:1"><i style="width:34%"></i></div><span class="btn ghost">取消</span></div>
  </div>
  <div style="padding:8px 14px">
    <span class="search small" style="display:block;width:220px">在这条录音里搜…</span>
    <div class="small" style="margin-top:8px;line-height:2">
      <div><span class="kbd">12:31</span> <b>说话人 1</b>：选题简报每周二出……</div>
      <div style="background:var(--accent-soft);border-radius:4px"><span class="kbd">12:40</span> <b>说话人 2</b>：知乎、小红书先半自动跑一个月……</div>
      <div><span class="kbd">12:58</span> <b>说话人 1</b>：Rin 博客走接口直接发……</div>
    </div><div class="xs muted">点一句跳到对应时间播放</div>
  </div>
</div></div>`;

const article=`<div style="display:flex;height:100%">
<div style="width:290px;border-right:1px solid var(--line);padding:10px 12px;background:#fff">
  <div class="row small"><span class="pill" style="background:var(--ink);color:#fff">全部 14</span><span class="pill">草稿 1</span><span class="pill">成稿 2</span><span class="pill">已发布 11</span></div>
  <div class="xs muted" style="margin:6px 0 2px">绑定：内容库/文章</div>
  <div class="card sel"><div class="t">为什么我把笔记搬到 Obsidian</div><div class="row xs muted"><span class="chip c-run">成稿</span>今天 14:02 · 2,140 字</div></div>

  <div class="card"><div class="t">我的写作流水线</div><div class="row xs muted"><span class="chip c-q">草稿</span>截稿 11-08</div></div>
  <div class="card"><div class="t">语雀迁移踩坑</div><div class="row xs muted"><span class="chip c-ok">已发布</span>11-01</div></div>
</div>
<div style="flex:1;padding:14px 18px;background:#fff">
  <div class="row"><b style="font-size:16px">为什么我把笔记搬到 Obsidian</b><span class="chip c-run">成稿</span></div>
  <div class="xs muted">index.md · 2,140 字</div>
  <div class="row" style="margin:8px 0"><span class="btn pri">编辑</span><span class="btn">复制</span><span class="btn">插入到对话</span><span class="btn">在 Obsidian 打开</span></div>
  <div class="row small muted">平台版本：<span class="chip c-ok">知乎</span><span class="chip c-ok">小红书</span><span class="chip c-run">Rin 生成中</span><u style="margin-left:auto">去发布页审稿 →</u></div>

</div></div>`;

nav.innerHTML=S.map((s,i)=>`<button data-k="${s.k}" class="${i?'':'on'}">${s.n}</button>`).join('');
secs.innerHTML=S.map((s,i)=>`<section id="${s.k}" style="display:${i?'none':'block'}"><div class="lead">${s.lead}</div>${s.html()}${s.notes?notes(...s.notes):''}</section>`).join('');
function fit(){document.querySelectorAll('section').forEach(sec=>{if(sec.style.display==='none')return;const s=sec.querySelector('.stage');if(!s)return;const k=s.clientWidth/1280;s.firstElementChild.style.transform=`scale(${k})`;s.style.height=(760*k)+'px';});}
function show(k){nav.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===k));document.querySelectorAll('section').forEach(s=>s.style.display=s.id===k?'block':'none');try{localStorage.setItem('tab3',k)}catch(_){}fit();}
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.k);});
try{const t=localStorage.getItem('tab3');if(t&&document.getElementById(t))show(t);}catch(_){}
const shot=(location.hash.match(/^#shot=(\w+)/)||[])[1];if(shot&&document.getElementById(shot)){document.body.classList.add('shot');show(shot);}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
