[project]
name = "home-service"
version = "0.1.0"
description = "家里服务（Mac mini）：录音上传与转写调度"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Feng" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
